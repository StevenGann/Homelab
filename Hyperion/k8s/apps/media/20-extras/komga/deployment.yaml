apiVersion: apps/v1
kind: Deployment
metadata:
  name: komga
  namespace: media
  labels: { app: komga }
spec:
  replicas: 1
  strategy: { type: Recreate }          # RWO local-path config pins to a node
  selector:
    matchLabels: { app: komga }
  template:
    metadata:
      labels: { app: komga }
    spec:
      nodeSelector: { topology.kubernetes.io/zone: hyperion }
      securityContext:
        runAsUser: 568                  # apps UID — matches Akasha NFS mapall_user
        runAsGroup: 568
        fsGroup: 568
      containers:
        - name: komga
          image: gotson/komga:latest
          env:
            - { name: TZ, value: "America/Los_Angeles" }
            - { name: KOMGA_LIBRARIES_SCAN_CRON, value: "0 */6 * * *" }  # scan every 6h
            - { name: KOMGA_LIBRARIES_SCAN_STARTUP, value: "true" }
            - { name: KOMGA_REMEMBER_ME_KEY, valueFrom: { secretKeyRef: { name: komga-secret, key: remember-me-key, optional: true } } }
            - { name: KOMGA_SERVER_PORT, value: "25600" }
            # Heap capped to leave native headroom (image codecs: libheif/libjxl/libwebp/kepubify)
            # within the 2Gi limit. Book analysis of large CBRs OOMs the cgroup at 1Gi/-Xmx768m.
            - { name: JAVA_TOOL_OPTIONS, value: "-Xmx1536m" }
            # ─── SSO via Authentik (OIDC) — GATED until Phase 5 ────────────────
            # Komga speaks OAuth2/OIDC through Spring Security. Uncomment the four
            # SPRING_SECURITY_* vars below (and the komga-secret envFrom) once the
            # Cloudflare tunnel is live, so https://auth.stevengann.com resolves.
            #
            # Do NOT uncomment early: Komga performs OIDC discovery against
            # issuer-uri AT STARTUP. If the issuer does not resolve, the app fails
            # to boot — this is why it is staged rather than pre-enabled.
            #
            # registrationId is "authentik" and MUST match the redirect URI in
            # Heimdall/authentik/blueprints/40-provider-komga.yaml:
            #   https://komga.stevengann.com/login/oauth2/code/authentik
            #
            # - { name: SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_AUTHENTIK_ISSUER_URI, value: "https://auth.stevengann.com/application/o/komga/" }
            # - { name: SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_AUTHENTIK_USER_NAME_ATTRIBUTE, value: "preferred_username" }
            # - { name: SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_AUTHENTIK_CLIENT_NAME, value: "Authentik" }
            # - { name: SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_AUTHENTIK_SCOPE, value: "openid,email,profile" }
            # - { name: SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_AUTHENTIK_AUTHORIZATION_GRANT_TYPE, value: "authorization_code" }
            # - { name: SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_AUTHENTIK_REDIRECT_URI, value: "{baseUrl}/login/oauth2/code/{registrationId}" }
            # - { name: KOMGA_OAUTH2_ACCOUNT_CREATION, value: "true" }   # auto-create on first SSO login
          ports:
            - { name: http, containerPort: 25600 }
          volumeMounts:
            - { name: config,  mountPath: /config }                # H2 DB + covers — local-path
            - { name: comics,  mountPath: /comics, readOnly: true }  # Akasha Comics (NFS, read-only)
          startupProbe:                  # generous for first-boot DB init + library scan
            httpGet: { path: /, port: http }
            failureThreshold: 30
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 15
            timeoutSeconds: 5
          livenessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits:   { cpu: "1",    memory: "2Gi" }
      volumes:
        - name: config
          persistentVolumeClaim: { claimName: komga-config }
        - name: comics
          persistentVolumeClaim: { claimName: media-comics }
