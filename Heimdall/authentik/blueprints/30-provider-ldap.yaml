# LDAP — provider + application + outpost.
#
# This is the piece that retires the password-sync bot: Jellyfin's LDAP plugin
# (and any LDAP-capable app) authenticates native TV/mobile clients against this,
# so one Authentik password works everywhere — something OIDC/forward-auth cannot
# do for those clients.
#
# Connection params for the Jellyfin LDAP plugin (configured on Akasha — manual,
# outside this repo; see the runbook):
#   LDAP server      : 192.168.10.4   port 389  (or 636 LDAPS if you add a cert)
#   Base DN          : DC=lab,DC=homelab
#   User search base : ou=users,DC=lab,DC=homelab
#   Bind: per-user bind (bind_mode: direct, the default) — Jellyfin passes the
#          friend's own credentials straight through. No service account needed.
#          If you do configure one, add it to friends-family; NEVER use akadmin.
#
# The outpost token is minted by Authentik when this blueprint creates the
# outpost. Copy it from the UI into AUTHENTIK_LDAP_OUTPOST_TOKEN, then redeploy
# so the `ldap` container in docker-compose.yml authenticates.
version: 1
metadata:
  name: homelab-provider-ldap
  labels:
    blueprints.goauthentik.io/instantiate: "true"
entries:
  - model: authentik_providers_ldap.ldapprovider
    id: provider-ldap
    identifiers: { name: LDAP }
    attrs:
      base_dn: "DC=lab,DC=homelab"

      # ── Flow fields as of authentik 2026.8.1 (corrected 2026-09-05) ──────────
      # The model was refactored: `bind_flow` -> `authentication_flow`,
      # `unbind_flow` is GONE, and `search_group` is GONE. Blueprint attrs that
      # no longer exist on the model are silently ACCEPTED AND DROPPED — the
      # entry applies "successfully" while doing nothing, which is how this hid.
      #
      # Symptom when authentication_flow is unset: every bind fails with
      #   ldap_bind: Invalid credentials (49)
      # and the outpost logs "failed to execute flow / Flow does not apply to
      # current user." — because it falls back to authorization_flow, and the
      # authorization flows are `authentication = require_authenticated`, which
      # can never be true for a user who is still trying to authenticate.
      #
      # BOTH authentication_flow and authorization_flow must point at
      # default-authentication-flow. That looks wrong and isn't:
      #
      # The LDAP outpost executes the **authorization_flow** to service a bind —
      # verified in the server log, which shows
      #   /api/v3/flows/executor/<authorization_flow>/?query=...outpost/ldap=true
      # on every bind request. So whatever authorization_flow points at must be
      # enterable by a user who is NOT yet authenticated.
      #
      # The stock authorization flows (default-provider-authorization-implicit-
      # consent / -explicit-consent) are `authentication = require_authenticated`,
      # which can never be true mid-bind. Pointing authorization_flow at one of
      # them makes EVERY bind fail with `ldap_bind: Invalid credentials (49)`
      # while the outpost logs "Flow does not apply to current user." — an error
      # that looks like a password problem and is not.
      #
      # default-authentication-flow is designation=authentication,
      # authentication=none, so it applies to an unauthenticated user and runs
      # identification + password headlessly. Verified working 2026-09-05:
      # correct password returns the user DN, wrong password is rejected.
      authentication_flow:
        !Find [authentik_flows.flow, [slug, default-authentication-flow]]
      authorization_flow:
        !Find [authentik_flows.flow, [slug, default-authentication-flow]]
      invalidation_flow:
        !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      mfa_support: true

  - model: authentik_core.application
    identifiers: { slug: ldap }
    attrs:
      name: LDAP
      provider: !KeyOf provider-ldap
      meta_description: LDAP directory for Jellyfin and other native-client apps
      group: Infrastructure
      policy_engine_mode: any

  # Scope who may bind over LDAP. This REPLACES the provider's old `search_group`
  # field (removed in 2026.8.1): access is now gated by policy bindings on the
  # application, the same mechanism Homarr and Nextcloud use. Without this every
  # authentik user could bind, not just friends-family.
  - model: authentik_policies.policybinding
    identifiers:
      target: !Find [authentik_core.application, [slug, ldap]]
      group: !Find [authentik_core.group, [name, friends-family]]
      order: 0
    attrs:
      enabled: true

  - model: authentik_outposts.outpost
    identifiers: { name: LDAP }
    attrs:
      type: ldap
      providers:
        - !Find [authentik_providers_ldap.ldapprovider, [name, LDAP]]
      config:
        authentik_host: "http://server:9000"
        authentik_host_insecure: true
        log_level: info
