# systemd-journal-remote retention for the Hyperion log sink.
#
# Without an explicit MaxUse, the receiver falls back to journald's default cap
# (10% of the filesystem, itself capped at 4G). That default is large enough to
# be uncomfortable on Heimdall's 98G root LV, and it is invisible — nothing in
# the repo said what the limit was. Pin it so the sink cannot grow without
# bound and the budget is reviewable in git.
#
# Bound on the compose service as a read-only bind mount so the image stays
# generic (it is also usable for the flashing-time sink).
#
# Raising this: check `df -h /` on Heimdall first. The journal is the only
# unbounded writer in this stack; everything else writes into images/.

[Remote]
MaxUse=4G
MaxFileSec=1week
