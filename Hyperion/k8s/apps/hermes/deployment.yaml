apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes
  namespace: hermes
  labels:
    app: hermes
    homelab.lab/auto-refresh: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate            # RWO PVC — never two pods mounting at once
  selector:
    matchLabels:
      app: hermes
  template:
    metadata:
      labels:
        app: hermes
    spec:
      # Pinned to hyperion-kappa: Guppy's home now lives on kappa's 206 GB
      # node-storage partition via the hostPath `data` volume below — the proper,
      # declarative version of the 2026-10-30 "migrate to the big partition" that
      # the live-symlink migrate.sh botched. hostPath is node-local, so the pod
      # must stay on kappa. zone=hyperion also keeps it off the tainted control
      # plane (ADR-0002).
      nodeSelector:
        topology.kubernetes.io/zone: hyperion
        kubernetes.io/hostname: hyperion-kappa
      initContainers:
        # Seed config.yaml onto the PVC only if absent (preserves dashboard edits).
        - name: seed-config
          image: busybox:1.37
          command:
            - sh
            - -c
            - '[ -f /opt/data/config.yaml ] || cp /seed/config.yaml /opt/data/config.yaml'
          volumeMounts:
            - { name: data, mountPath: /opt/data }
            - { name: config-seed, mountPath: /seed }
      containers:
        # ── Hermes gateway + supervised dashboard (s6) ──────────────────────
        - name: hermes
          image: ghcr.io/stevengann/hermes-agent:latest
          imagePullPolicy: Always
          args: ["gateway", "run"]
          env:
            - { name: HERMES_HOME,            value: "/opt/data" }
            - { name: HERMES_UID,             value: "10000" }
            - { name: HERMES_GID,             value: "10000" }
            - { name: HERMES_DASHBOARD,       value: "1" }
            - { name: HERMES_DASHBOARD_HOST,  value: "127.0.0.1" }   # loopback → no OAuth gate; sidecar-only
            - { name: HERMES_DASHBOARD_PORT,  value: "9119" }
            - { name: HERMES_DASHBOARD_TUI,   value: "1" }           # in-browser chat tab
            - name: DEEPSEEK_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-deepseek
                  key: DEEPSEEK_API_KEY
            - name: BIFROST_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-bifrost
                  key: BIFROST_API_KEY
            # Discord bot token (GUPPI#6222). Presence of this env is what
            # activates the Discord platform (check_discord_tool_requirements →
            # _get_bot_token). The `hermes-discord` Secret is created out-of-band
            # (sops isn't available on the edge workstation); re-encrypt it into
            # git as hermes-discord.sops.yaml from owner-thinkpad to make it
            # reproducible. Lost in the 2026-10-30 migration; restored 2026-10-30.
            - name: DISCORD_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hermes-discord
                  key: DISCORD_BOT_TOKEN
            # Discord access policy (comma-separated snowflake IDs; NOT secret).
            # The adapter reads these env vars directly (_get_allowed_* →
            # _gate_raw); allowed_users OR allowed_roles grants access, and
            # allowed_channels scopes where. Kept in git (not live config.yaml)
            # so they survive a PVC wipe — the original policy was lost that way
            # in the 2026-10-30 migration. Role gating is guild-scoped.
            - { name: DISCORD_ALLOWED_USERS,    value: "906694539476078612" }
            - { name: DISCORD_ALLOWED_CHANNELS, value: "1377044338994839654" }
            - { name: DISCORD_ALLOWED_ROLES,    value: "1551060962222538872" }
            - { name: DISCORD_HOME_CHANNEL,           value: "1511262544629858374" }
            - { name: DISCORD_HOME_CHANNEL_THREAD_ID, value: "" }
          volumeMounts:
            - { name: data, mountPath: /opt/data }
          resources:
            requests: { cpu: "100m", memory: "512Mi" }
            limits:   { cpu: "2",    memory: "2Gi" }
        # ── basic-auth reverse proxy (the only thing the LB exposes) ────────
        - name: dashboard-proxy
          image: nginx:1.30.1-alpine
          ports:
            - { name: http, containerPort: 8080 }
          volumeMounts:
            - { name: proxy-conf, mountPath: /etc/nginx/conf.d/default.conf, subPath: default.conf }
            - { name: htpasswd,   mountPath: /etc/nginx/.htpasswd,           subPath: .htpasswd }
          readinessProbe:
            tcpSocket: { port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: "10m",  memory: "16Mi" }
            limits:   { cpu: "200m", memory: "64Mi" }
      volumes:
        - name: data
          # Guppy's HERMES_HOME on kappa's 206 GB ext4 node-storage partition
          # (nvme0n1p3), NOT the 32 GB root local-path PVC that hit DiskPressure
          # and could only hold a pruned subset. The full ~13 GB home (clean
          # state.db = 6124 sessions/150247 msgs, real config.yaml with Bifrost/
          # TTS/webhook, kubectl, k3s.yaml, .gitwork, memories) lives here;
          # recovered + restored 2026-10-31. The old `hermes-data` PVC is left
          # defined (pvc.yaml) but unmounted, for rollback.
          hostPath:
            path: /mnt/node-storage/hermes-data
            type: Directory
        - name: config-seed
          configMap:
            name: hermes-config-seed
        - name: proxy-conf
          configMap:
            name: hermes-dashboard-proxy
        - name: htpasswd
          secret:
            secretName: hermes-dashboard-auth
            items:
              - { key: .htpasswd, path: .htpasswd }
