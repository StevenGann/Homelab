apiVersion: v1
kind: ConfigMap
metadata:
  name: bifrost
  namespace: bifrost
data:
  BACKENDS: '[{"name":"deepseek","base_url":"https://api.deepseek.com","api_key_env":"UPSTREAM_API_KEY"},{"name":"epsilon","base_url":"http://192.168.0.105:11434","local":true},{"name":"elevenlabs","base_url":"https://api.elevenlabs.io","kind":"elevenlabs","api_key_env":"ELEVENLABS_API_KEY"}]'
  ROUTES: '{"coach":"deepseek/deepseek-v4-flash","deepseek-v4-flash":"deepseek/deepseek-v4-flash","deepseek-v4-pro":"deepseek/deepseek-v4-pro","private:local":"epsilon/qwen2.5:7b","embed":"epsilon/nomic-embed-text"}'
  FALLBACKS: '{"deepseek-v4-pro":"deepseek-v4-flash"}'
  # Speech. Audio routes stay out of ROUTES so they are never advertised as
  # chat models. TTS_COST_PER_CHAR is the blended rate of the ElevenLabs
  # Creator annual plan: $220/year for 100k characters a month, i.e.
  # 220 / 1,200,000 = 0.00018333 per character. Marginal cost while inside the
  # plan is zero, but a rate that reads zero hides spend, so the plan's own
  # average is what gets booked. Recheck if the tier changes.
  AUDIO_ROUTES: '{"tts":"elevenlabs/eleven_multilingual_v2","tts-v4":"elevenlabs/eleven_v4"}'
  TTS_VOICES: '{"alloy":"pNInz6obpgDQGcFmaJgB"}'
  TTS_VOICE: "pNInz6obpgDQGcFmaJgB"
  TTS_COST_PER_CHAR: "0.0001833"
  LEDGER_FILE: /data/spend.jsonl
  # Monthly spend ceiling, USD. Raised from 20 on 2026-10-29 after the gateway
  # legitimately hit it mid-session; 0 disables the limit entirely.
  BUDGET: "500"
  # Tenant keys are minted into the same PVC as the ledger. ANON=closed since
  # 2026-10-29: every caller holds a key and anonymous traffic is refused.
  KEYS_FILE: /data/keys.json
  ANON: "closed"
  ANON_RATE_LIMIT: "60"
  ANON_BUDGET: "2"
