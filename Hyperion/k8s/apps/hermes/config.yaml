# Seed config for the Hermes gateway. The initContainer copies this to
# {HERMES_HOME}/config.yaml (=/opt/data/config.yaml) ONLY if absent, so any
# changes the operator makes via the dashboard (`hermes model`, etc.) survive
# reconciliation. To force a re-seed, delete /opt/data/config.yaml on the PVC.
#
# DeepSeek is a first-class provider: the DEEPSEEK_API_KEY env (from the
# hermes-deepseek SOPS Secret) registers the credential; this pins the provider
# + default model so the gateway is non-interactive on first boot.
#
# WIDE-OPEN POSTURE (operator choice, 2026-06-02): the blocks below disable
# Hermes's approval prompts, Tirith pre-exec scanning, and secret redaction so
# the agent can self-modify and run scripts freely. Hermes DEEP-MERGES this over
# its built-in defaults, so only the non-default keys need to appear here. This
# governs a FRESH PVC's first boot only — it does NOT touch an existing
# /opt/data/config.yaml (already configured live on the running cluster). The
# matching live edit + rationale + the one non-config restriction (hardcoded
# *_API_KEY/*_TOKEN env scrubbing in code_execution) are recorded with the
# change that introduced this. Re-enable guards only with operator sign-off.
apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-config-seed
  namespace: hermes
data:
  config.yaml: |
    model:
      provider: custom:bifrost
      # live value; the seed drifted to 'deepseek-chat', which is not a
      # Bifrost route, so a rebuilt PVC would have failed every call.
      default: deepseek-v4-flash
    # The one deliberate exception to "everything through Bifrost": if the
    # gateway itself is down, this agent keeps answering on a direct DeepSeek
    # path. Every other agent has an empty fallback list.
    fallback_providers:
      - provider: deepseek
        model: deepseek-flash
    # Inference goes through Bifrost so every agent's spend lands in one ledger.
    # The key arrives as BIFROST_API_KEY from a SOPS secret, not from this file.
    providers:
      bifrost:
        base_url: http://bifrost.bifrost.svc.cluster.local:11434/v1
        key_env: BIFROST_API_KEY
    # ── Approvals: bypass every prompt ──────────────────────────────────────
    approvals:
      mode: 'off'                  # quoted: bare `off` parses as YAML bool False
      cron_mode: approve
      mcp_reload_confirm: false
      destructive_slash_confirm: false
    command_allowlist:
      - '*'                        # moot under mode=off, kept belt-and-braces
    hooks_auto_accept: true        # accept shell-hooks without a TTY prompt
    # ── Security scanners off ───────────────────────────────────────────────
    security:
      tirith_enabled: false
      redact_secrets: false
      allow_private_urls: true
      allow_lazy_installs: true
    browser:
      allow_private_urls: true
    # ── Execution: capable mode + generous timeouts ─────────────────────────
    code_execution:
      mode: project
      timeout: 1800
    terminal:
      timeout: 1800
    agent:
      disabled_toolsets: []
    # ── Discord ──────────────────────────────────────────────────────────────
    # The bot (GUPPI#6222) activates via the DISCORD_BOT_TOKEN env (see the
    # deployment + the out-of-band hermes-discord Secret), not from this file.
    # require_mention keeps Guppy responsive-not-proactive per the agent rules.
    # The allowlists (user / channel / role) are set as DISCORD_ALLOWED_* env in
    # the deployment, NOT here: the adapter reads those env vars directly
    # (_gate_raw), the config key for users is the non-obvious `allow_from`, and
    # env is git-durable across a PVC wipe — which is exactly how the original
    # "specific channels and roles" config was lost in the 2026-10-30 migration.
    # NOTE: this seed block only governs a FRESH PVC; the env vars govern both.
    discord:
      require_mention: true
    # ── Platforms ──────────────────────────────────────────────────────────
    platforms:
      api_server:
        extra:
          host: 0.0.0.0
          port: 8646
