apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hermes
resources:
  - namespace.yaml
  - deepseek.sops.yaml
  - bifrost.sops.yaml        # SOPS-encrypted — decrypted by kustomize-controller
  - dashboard-auth.sops.yaml  # SOPS-encrypted — decrypted by kustomize-controller
  - discord.sops.yaml         # SOPS-encrypted — Discord bot token (git is the only source)
  - config.yaml               # ConfigMap: config.yaml seed
  - nginx-proxy.yaml          # ConfigMap: basic-auth proxy
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - backup-cronjob.yaml      # nightly home -> Akasha, runs on the node's hostPath
  - rescue-rbac.yaml         # Jeeves' break-glass access to this namespace

# The Kustomization sets `namespace: hermes`, and that transformer rewrites
# RoleBinding subjects too — which silently re-pointed the rescue binding at a
# nonexistent ServiceAccount in the wrong namespace. Jeeves lives in `jeeves`;
# put the subject back after the transformer runs.
patches:
  - target:
      kind: RoleBinding
      name: guppy-rescuer
    patch: |-
      - op: replace
        path: /subjects/0/namespace
        value: jeeves
