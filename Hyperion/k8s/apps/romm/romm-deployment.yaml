---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: romm
  namespace: romm
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: romm
  template:
    metadata:
      labels:
        app: romm
    spec:
      nodeSelector:
        topology.kubernetes.io/zone: hyperion
      containers:
        - name: romm
          image: rommapp/romm:4.8.1
          env:
            - name: DB_HOST
              value: romm-db
            - name: DB_NAME
              value: romm
            - name: DB_USER
              value: romm-user
            - name: DB_PASSWD
              value: "8bedd00edbd2a635ef483a641014c43b"
            - name: ROMM_AUTH_SECRET_KEY
              value: "3a55e7cefd3e1a894926f6237327db14b702eaa92eedd9a2a12f60c067a6ff62"
            - name: IGDB_CLIENT_ID
              value: "0sg29dftcy58wd0c6w7repqv53fbq3"
            - name: IGDB_CLIENT_SECRET
              value: "d9ushhv5hk09y4ymbp3c6yc83q3vwh"
            # ─── SSO via Authentik (OIDC) — STAGED, DISABLED until Phase 5 ────
            # RomM 4.8.1 supports OIDC natively (GET /api/heartbeat reports the
            # OIDC block). Flip OIDC_ENABLED to "true" once the Cloudflare tunnel
            # is live and https://auth.stevengann.com resolves — until then the
            # discovery call would fail.
            # Callback is a FIXED path, not Spring's convention; it must match
            # Heimdall/authentik/blueprints/50-provider-romm.yaml:
            #   https://romm.stevengann.com/api/oauth/openid
            # Leave DISABLE_USERPASS_LOGIN unset so the local admin stays as
            # break-glass (D-13).
            - name: OIDC_ENABLED
              value: "false"                       # → "true" in Phase 5
            - name: OIDC_PROVIDER
              value: "authentik"
            - name: OIDC_REDIRECT_URI
              value: "https://romm.stevengann.com/api/oauth/openid"
            - name: OIDC_SERVER_APPLICATION_URL
              value: "https://auth.stevengann.com/application/o/romm"
            - name: OIDC_CLIENT_ID
              valueFrom: { secretKeyRef: { name: romm-oidc, key: OIDC_CLIENT_ID, optional: true } }
            - name: OIDC_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: romm-oidc, key: OIDC_CLIENT_SECRET, optional: true } }
            - name: ROMM_PORT
              value: ""
            - name: ROMM_PORT_80_TCP
              value: ""
            - name: ROMM_PORT_8080_TCP
              value: ""
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: resources
              mountPath: /romm/resources
            - name: redis-data
              mountPath: /redis-data
            - name: config
              mountPath: /romm/config
            - name: library
              mountPath: /romm/library
          startupProbe:
            httpGet:
              path: /api/heartbeat
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/heartbeat
              port: 8080
            # 2026-08-20: 30s/30s was STILL too tight. Hashing multi-file DOS
            # folders (hundreds of files each) over NFS blocks the single-worker
            # uvicorn backend for well over a minute, so /api/heartbeat returned
            # 499 at the 30s mark and the liveness probe killed the pod mid-scan
            # (exit 137, reason "Error" — NOT OOMKilled; memory sat at 1.9/3Gi).
            # 120s timeout + 60s period tolerates a multi-minute hash burst; 5
            # consecutive liveness failures (~5 min window) before any kill.
            periodSeconds: 60
            timeoutSeconds: 120
          livenessProbe:
            httpGet:
              path: /api/heartbeat
              port: 8080
            periodSeconds: 60
            timeoutSeconds: 120
            failureThreshold: 5
          resources:
            requests:
              memory: 256Mi
            limits:
              # OOM/hang history: chunked ISO upload assembly buffers the file
              # in memory. 1Gi OOM'd; 2Gi still borderline — a 1.4GiB GameCube
              # ISO + ~310MB base footprint (backend+nginx+rq+valkey) peaked
              # near the ceiling and hung the backend (liveness kill, exit 137
              # reason Error, not OOMKilled) on 2026-08-19. 3Gi for real
              # headroom; 4Gi (2026-08-20) as further insurance during full-
              # library scans of folder-per-game DOS/ScummVM platforms.
              # NOTE: Wii ISOs (~4.7GiB) would still need more.
              memory: 4Gi
      volumes:
        - name: resources
          persistentVolumeClaim:
            claimName: romm-resources
        - name: redis-data
          persistentVolumeClaim:
            claimName: romm-redis
        - name: config
          persistentVolumeClaim:
            claimName: romm-config
        - name: library
          nfs:
            server: 192.168.10.247
            path: /mnt/Media-Storage/Media/ROMs
