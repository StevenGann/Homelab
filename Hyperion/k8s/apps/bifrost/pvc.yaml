# bifrost-data : durable JSONL spend ledger (spend.jsonl) so monthly budgets
# survive pod restarts. RWO local-path (replicas:1 + Recreate).
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: bifrost-data, namespace: bifrost }
spec:
  accessModes: [ReadWriteOnce]
  # Bound to the static PV in pv.yaml. volumeName + storageClassName "" make the
  # binding explicit and keep local-path's provisioner away from the tainted
  # control plane, where its helper pod cannot schedule.
  storageClassName: ""
  volumeName: bifrost-data
  resources: { requests: { storage: 1Gi } }
