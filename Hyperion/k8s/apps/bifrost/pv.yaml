# Static volume for the bifrost ledger.
#
# Heimdall carries `node.homelab/control-plane-only=true:NoExecute`, and the
# local-path provisioner is a single Deployment on hyperion-eta that creates
# directories through a helper pod — that helper cannot schedule onto a tainted
# node, so a dynamically provisioned PVC would hang Pending forever. A static
# PV pinned to Heimdall is the supported way to put state on this host.
#
# Reclaim policy is Retain: the ledger is the record of what we spent. Losing it
# to a mistaken `kubectl delete pvc` would be the expensive failure mode, not a
# full disk.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: bifrost-data
  labels: { app: bifrost }
spec:
  capacity: { storage: 1Gi }
  accessModes: [ReadWriteOnce]
  volumeMode: Filesystem
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""            # static binding; no provisioner involved
  claimRef:                       # pre-bind, so nothing else can take it
    namespace: bifrost
    name: bifrost-data
  hostPath:
    path: /var/lib/rancher/k3s/storage/bifrost-static-data
    type: DirectoryOrCreate
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - { key: kubernetes.io/hostname, operator: In, values: [heimdall-control-plane] }
