---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: romm
  namespace: romm
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: romm
  template:
    metadata:
      labels:
        app: romm
    spec:
      nodeSelector:
        topology.kubernetes.io/zone: hyperion
      containers:
        - name: romm
          image: rommapp/romm:4.8.1
          env:
            - name: DB_HOST
              value: romm-db
            - name: DB_NAME
              value: romm
            - name: DB_USER
              value: romm-user
            - name: DB_PASSWD
              value: "8bedd00edbd2a635ef483a641014c43b"
            - name: ROMM_AUTH_SECRET_KEY
              value: "3a55e7cefd3e1a894926f6237327db14b702eaa92eedd9a2a12f60c067a6ff62"
            - name: IGDB_CLIENT_ID
              value: "0sg29dftcy58wd0c6w7repqv53fbq3"
            - name: IGDB_CLIENT_SECRET
              value: "d9ushhv5hk09y4ymbp3c6yc83q3vwh"
            - name: ROMM_PORT
              value: ""
            - name: ROMM_PORT_80_TCP
              value: ""
            - name: ROMM_PORT_8080_TCP
              value: ""
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: resources
              mountPath: /romm/resources
            - name: redis-data
              mountPath: /redis-data
            - name: config
              mountPath: /romm/config
            - name: library
              mountPath: /romm/library
          startupProbe:
            httpGet:
              path: /api/heartbeat
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/heartbeat
              port: 8080
            # Raised from 10s/5s — a COMPLETE/HASHES scan of large ISOs blocks the
            # single-worker backend while hashing (CPU-saturating on the Pi 5), which
            # starved /api/heartbeat past the 5s timeout and tripped the liveness
            # probe (pod killed mid-scan, ROMs left unhashed/unmatched). 30s/30s
            # gives the backend time to finish hashing before probes fail.
            periodSeconds: 30
            timeoutSeconds: 30
          livenessProbe:
            httpGet:
              path: /api/heartbeat
              port: 8080
            periodSeconds: 30
            timeoutSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              memory: 256Mi
            limits:
              # OOM/hang history: chunked ISO upload assembly buffers the file
              # in memory. 1Gi OOM'd; 2Gi still borderline — a 1.4GiB GameCube
              # ISO + ~310MB base footprint (backend+nginx+rq+valkey) peaked
              # near the ceiling and hung the backend (liveness kill, exit 137
              # reason Error, not OOMKilled) on 2026-08-19. 3Gi for real
              # headroom. NOTE: Wii ISOs (~4.7GiB) would still need more.
              memory: 3Gi
      volumes:
        - name: resources
          persistentVolumeClaim:
            claimName: romm-resources
        - name: redis-data
          persistentVolumeClaim:
            claimName: romm-redis
        - name: config
          persistentVolumeClaim:
            claimName: romm-config
        - name: library
          nfs:
            server: 192.168.10.247
            path: /mnt/Media-Storage/Media/ROMs
