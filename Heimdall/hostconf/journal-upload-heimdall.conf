# Heimdall — systemd-journal-upload drop-in.
#
# Installed to /etc/systemd/journal-upload.conf.d/heimdall.conf by setup.sh.
# Ships all journal entries (including Docker journald log-driver output for
# every container) to the journal-remote receiver running on THIS host.
#
# History: this drop-in previously pointed at Akasha (`192.168.10.247:19532`).
# The journal-remote sink was migrated off Akasha onto Heimdall
# (Heimdall/hyperion/docker-compose.yml), but this file kept the old address —
# so Heimdall's own uploader failed continuously with `code: 5 (Input/output
# error)` and was invisible to any central log search. Point it at the local
# sink. `127.0.0.1` is correct (not the LAN IP): the sink is a published
# container port on this host, so loopback avoids depending on the VLAN.
#
# Persistent local journal is still kept (under /var/log/journal) for local
# buffering while the sink is unreachable.

[Upload]
URL=http://127.0.0.1:19532
