# Deliberately has NO `namespace:` field.
#
# The parent kustomization sets `namespace: hermes` and that transformer rewrites
# RoleBinding subjects along with everything else — which silently re-pointed the
# rescue binding at a ServiceAccount in the wrong namespace. A nested
# kustomization without the transformer leaves the subject alone.
#
# (tested: patches run before the namespace transformer, so a JSON6902 patch on
# /subjects/0/namespace does not survive either)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - rescue-rbac.yaml
