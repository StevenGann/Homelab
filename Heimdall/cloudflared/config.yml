# Cloudflare Tunnel — ingress (locally-managed = IaC source of truth)
#
# Public web services only. cloudflared dials these origins over the LAN; only the
# hostnames listed here are routable from the internet. Cloudflare's edge presents
# the public cert for *.stevengann.com, so no origin cert/CA work is needed.
#
# Games (mc/se) are NOT here — Cloudflare's free tunnel is HTTP-only. They use a
# grey-cloud DNS record + UCG port-forward (see README + the runbook).
#
# Fill `tunnel:` with the UUID from `cloudflared tunnel create heimdall`. The
# matching credentials.json is shipped (SOPS) to /etc/cloudflared/credentials.json.

tunnel: REPLACE_WITH_TUNNEL_UUID
credentials-file: /etc/cloudflared/credentials.json

# Outbound keep-alive niceties (optional, sane defaults).
originRequest:
  connectTimeout: 30s
  noHappyEyeballs: true

ingress:
  # ── Authentik (REQUIRED for public OIDC login) ──────────────────────────────
  # Via Caddy so X-Forwarded-Proto is set and the issuer is built as https. Caddy
  # must answer auth.stevengann.com (added to the auth block in Caddyfile).
  - hostname: auth.stevengann.com
    service: https://192.168.10.4:443
    originRequest:
      noTLSVerify: true                 # Caddy serves its internal-CA cert to cloudflared
      originServerName: auth.stevengann.com

  # ── Jellyfin is NOT on the tunnel ───────────────────────────────────────────
  # Deliberately excluded (operator decision 2026-06-02): heavy video risks
  # Cloudflare ToS §2.8. jf.stevengann.com is exposed DIRECTLY instead — grey-cloud
  # DNS + UCG port-forward → a dedicated, isolated Caddy listener (:7443). See the
  # Caddyfile "Public Jellyfin" block + runbook §8.

  # ── Seerr (media requests) ──────────────────────────────────────────────────
  - hostname: seerr.stevengann.com
    service: http://192.168.10.54         # MetalLB VIP :80

  # ── Navidrome (music) — DELIBERATELY NOT EXPOSED (D-2, 2026-09-05) ──────────
  # Subsonic clients authenticate every request with md5(password + salt), where
  # the salt is client-chosen per request. To verify that, the server must hold a
  # RECOVERABLE password — so Navidrome cannot bind to LDAP or consume OIDC for
  # its native clients, and Cloudflare Access can't gate it either (same reason
  # Access can't front Jellyfin). Publicly it would be an internet-facing endpoint
  # with a password outside the directory, no MFA and no central revocation.
  # Friends use Jellyfin for music. Navidrome stays LAN/VPN.

  # ── Homarr (friend landing page) ────────────────────────────────────────────
  - hostname: homarr.stevengann.com
    service: http://192.168.10.53         # MetalLB VIP :80

  # ── Nextcloud (files / calendar / contacts) ─────────────────────────────────
  # Deployed v34.0.3 at 192.168.10.87 (verified 2026-09-05). Desktop/mobile sync
  # clients authenticate with app-passwords over plain HTTPS, so they traverse the
  # tunnel fine — but do NOT put Cloudflare Access in front of this hostname or
  # those clients break.
  - hostname: cloud.stevengann.com
    service: http://192.168.10.87         # MetalLB VIP :80

  # ── Komga (comics / manga) ──────────────────────────────────────────────────
  # Browser-only + OPDS. Authentik OIDC (Spring Security), scoped to
  # friends-family. Added 2026-09-05 on operator request.
  - hostname: komga.stevengann.com
    service: http://192.168.10.82:25600

  # ── RomM (retro game ROM library) ───────────────────────────────────────────
  # Browser-only. Authentik OIDC (native, v4.8.1+), scoped to friends-family.
  # Added 2026-09-05 on operator request.
  - hostname: romm.stevengann.com
    service: http://192.168.10.78:8080

  # ── Pterodactyl panel (game-server management) ──────────────────────────────
  # SHARED BUT NOT SSO-INTEGRATED. Panel v1.11.11 has no native OIDC/SAML/LDAP,
  # so it keeps its own local login — friends get a Pterodactyl account, not an
  # authentik one. Enable Pterodactyl's built-in 2FA for every account that can
  # reach it, since its password is the only gate on a public endpoint.
  # NOTE: this exposes the PANEL only. The game servers themselves speak raw
  # TCP/UDP, which a Cloudflare HTTP tunnel cannot carry — those need port
  # forwards and are deferred with Thoth (D-14). The panel's only Wings host IS
  # Thoth, so until it returns the panel is reachable but can start nothing.
  - hostname: panel.stevengann.com
    service: http://192.168.10.69:80

  # ── Beszel (host monitoring) ────────────────────────────────────────────────
  # Authentik OIDC via PocketBase's OAuth2 support, scoped to friends-family.
  # Redirect is PocketBase's fixed /api/oauth2-redirect.
  - hostname: beszel.stevengann.com
    service: http://192.168.10.68:8090

  # ── Musicseerr (music requests) ─────────────────────────────────────────────
  # A Jellyseerr fork: /api/v1/auth/jellyfin exists (returns 401, not 404), so it
  # inherits the LDAP-backed Jellyfin accounts exactly as Seerr does. No separate
  # authentik provider is needed — enable "Sign in with Jellyfin" in its settings.
  - hostname: musicseerr.stevengann.com
    service: http://192.168.10.74:8688

  # ── Uptime-Kuma — NOT EXPOSED (operator decision 2026-09-05) ────────────────
  # Briefly included, then dropped. v1.23.16 has local auth only (v1 never gained
  # OIDC), so exposing the admin UI would put the whole monitoring config behind
  # nothing but its own password. A public status page would have been the safe
  # alternative, but the admin UI is not worth the surface. Stays LAN/VPN.

  # ── Subwave — SERVED BY A SEPARATE TUNNEL (2026-09-05) ──────────────────────
  # Deliberately NOT on this tunnel. Subwave streams continuous audio, which is
  # the same CDN-terms exposure that kept Jellyfin off Cloudflare entirely (D-1).
  # This tunnel carries the IDENTITY PLANE (auth.stevengann.com) — if a ToS action
  # landed on it, every OIDC login in the lab would stop at once. Subwave gets its
  # own tunnel so that blast radius is Subwave alone.
  # See Heimdall/cloudflared-stream/.

  # ── Immich — DELIBERATELY NOT EXPOSED (D-3, 2026-09-05) ─────────────────────
  # Technically tunnel-compatible (in-app-browser OAuth, then bearer tokens), but
  # a first phone backup is tens of GB of uploads and the service may be retired.
  # Stays LAN/VPN. Wiring notes: docs/design/public-access-plan.md §8.

  # Catch-all: anything not matched above is refused (don't proxy the whole host).
  - service: http_status:404
