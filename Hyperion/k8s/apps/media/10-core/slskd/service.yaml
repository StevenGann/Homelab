apiVersion: v1
kind: Service
metadata:
  name: slskd
  namespace: media
  # No metallb.io/loadBalancerIPs pin: MetalLB allocates one from the media pool.
  # Pinning is the house style, but that address has to also be registered in
  # Technitium, and guessing it here would be worse than letting MetalLB pick.
  annotations:
    metallb.universe.tf/allow-shared-ip: slskd
spec:
  type: LoadBalancer
  selector: { app: slskd }
  ports:
    - { name: http,         port: 5030,  targetPort: 5030 }
    - { name: soulseek,     port: 50300, targetPort: 50300, protocol: TCP }
    - { name: soulseek-udp, port: 50300, targetPort: 50300, protocol: UDP }
