# Nextcloud — OIDC provider + application (PLACEHOLDER).
#
# Nextcloud IS deployed (v34.0.3 at 192.168.10.87, verified 2026-09-05) and is on
# the public allowlist as cloud.stevengann.com. To finish the wiring: install the
# `user_oidc` app in Nextcloud and point it at the PUBLIC issuer
# https://auth.stevengann.com/application/o/nextcloud/ with the client_id below
# and the secret read back from the Authentik UI.
# Public issuer, not auth.lab: the OIDC issuer must be the same hostname friends
# reach from the internet, or token validation fails for them.
#
# The client secret here is generated INSIDE Authentik on first apply (no !Env),
# then read back from the UI (Providers → Nextcloud) when you configure
# Nextcloud. Restricted to friends-family like Homarr.
#
# To defer entirely, flip the instantiate label to "false".
version: 1
metadata:
  name: homelab-provider-nextcloud
  labels:
    blueprints.goauthentik.io/instantiate: "true"
entries:
  - model: authentik_providers_oauth2.oauth2provider
    id: provider-nextcloud
    identifiers: { name: Nextcloud }
    attrs:
      client_type: confidential
      client_id: nextcloud
      authorization_flow:
        !Find [authentik_flows.flow, [slug, default-provider-authorization-explicit-consent]]
      invalidation_flow:
        !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key:
        !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
      redirect_uris:
        - matching_mode: strict
          url: "https://cloud.stevengann.com/apps/user_oidc/code"
        - matching_mode: regex
          url: "https?://nextcloud\\.lab/apps/user_oidc/code"
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, "goauthentik.io/providers/oauth2/scope-openid"]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, "goauthentik.io/providers/oauth2/scope-email"]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, "goauthentik.io/providers/oauth2/scope-profile"]]

  - model: authentik_core.application
    identifiers: { slug: nextcloud }
    attrs:
      name: Nextcloud
      provider: !KeyOf provider-nextcloud
      meta_launch_url: https://cloud.stevengann.com
      meta_description: Files / calendar / contacts
      group: Productivity
      policy_engine_mode: any

  - model: authentik_policies.policybinding
    identifiers:
      target: !Find [authentik_core.application, [slug, nextcloud]]
      group: !Find [authentik_core.group, [name, friends-family]]
      order: 0
    attrs:
      enabled: true
