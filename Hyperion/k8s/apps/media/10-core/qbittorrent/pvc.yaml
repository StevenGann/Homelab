# qBittorrent config on node-local local-path storage.
# 2026-07-17: MIGRATED OFF Akasha NFS after HTTP server hang incident.
# qbittorrent-nox's Qt event loop blocks when NFS I/O stalls (Ssl state),
# TCP port stays bound but HTTP server stops responding → context deadline
# exceeded on httpGet probes → liveness kill + restart loop.
# Cross-node correlation: qbittorrent (A, hyperion-eta) and qbittorrent3 (C,
# hyperion-kappa) both exhibited the same hang; qbittorrent2 (B, local-path)
# had zero probe failures. Config is now on local-path (/mnt/node-storage),
# same pattern as qbittorrent2/sonarr/radarr/lidarr/prowlarr (ADR-0003).
# Migration script: Hyperion/k8s/scripts/migrate-qbittorrent-nfs-to-localpath.sh
# Old data preserved at /mnt/Media-Storage/Application-Storage/media/qbittorrent-config on Akasha.
# Downloads are SHARED (media-downloads, still on NFS) — only the config dir is per-instance.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qbittorrent-config
  namespace: media
  annotations: { kustomize.toolkit.fluxcd.io/prune: disabled }
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources: { requests: { storage: 5Gi } }
