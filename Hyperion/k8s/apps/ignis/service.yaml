apiVersion: v1
kind: Service
metadata:
  name: ignis
  namespace: ignis
  annotations:
    metallb.io/loadBalancerIPs: 192.168.10.90
spec:
  type: LoadBalancer
  selector:
    app: ignis
  ports:
    # Native app port.
    - name: http
      port: 8080
      targetPort: 8080
    # Convenience: friendly http://192.168.10.90 with no port.
    - name: http80
      port: 80
      targetPort: 8080
