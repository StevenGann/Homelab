# bifrost-data : durable JSONL spend ledger (spend.jsonl) so monthly budgets
# survive pod restarts. RWO local-path (replicas:1 + Recreate).
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: bifrost-data, namespace: bifrost }
spec:
  accessModes: [ReadWriteOnce]
  # Bound by name to the PV that already holds the ledger. The file is the record
  # of every request and its cost, so a re-provisioned empty volume silently
  # restarts the month's totals.
  #
  # See README.md: the gateway does NOT run on Heimdall — pods on the
  # containerised control plane are unreachable from the workers
  # (docs/design/adr-0002-containerized-control-plane-networking.md).
  storageClassName: local-path   # must match the PV it is bound to by name
  volumeName: pvc-9063d387-549a-4176-9b76-9141db9c3647
  resources: { requests: { storage: 1Gi } }
