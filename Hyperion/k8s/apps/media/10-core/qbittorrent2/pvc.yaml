# qBittorrent instance #2 config on node-local local-path storage.
# 2026-07-17: MIGRATED OFF Akasha NFS after D-state hang incident.
# qbittorrent-nox blocked on NFS I/O (STAT=Dsl) with hard NFS mount →
# port 8085 never bound → startup probe failed → endless restarts.
# Config is now on local-path (/mnt/node-storage) per ADR-0003 interim
# architecture, same pattern as sonarr/radarr/lidarr/prowlarr.
# Migration script: Hyperion/k8s/scripts/migrate-qbittorrent2-nfs-to-localpath.sh
# Old data preserved at /mnt/Media-Storage/Application-Storage/media/qbittorrent2-config on Akasha.
# Downloads are SHARED (media-downloads, still on NFS) — only the config dir is per-instance.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qbittorrent2-config
  namespace: media
  annotations: { kustomize.toolkit.fluxcd.io/prune: disabled }
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources: { requests: { storage: 5Gi } }
