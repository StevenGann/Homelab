apiVersion: v1
kind: ConfigMap
metadata:
  name: bifrost
  namespace: bifrost
data:
  BACKENDS: '[{"name":"deepseek","base_url":"https://api.deepseek.com","api_key_env":"UPSTREAM_API_KEY"},{"name":"epsilon","base_url":"http://[REDACTED]:11434","local":true},{"name":"elevenlabs","base_url":"https://api.elevenlabs.io","kind":"elevenlabs","api_key_env":"ELEVENLABS_API_KEY"}]'
  ROUTES: '{"coach":"deepseek/deepseek-v4-flash","deepseek-v4-flash":"deepseek/deepseek-v4-flash","deepseek-v4-pro":"deepseek/deepseek-v4-pro","private:local":"epsilon/qwen2.5:7b","embed":"epsilon/nomic-embed-text"}'
  FALLBACKS: '{"deepseek-v4-pro":"deepseek-v4-flash"}'
  # Speech. Audio routes stay out of ROUTES so they are never advertised as
  # chat models. TTS_COST_PER_CHAR is 0 until the ElevenLabs plan's real
  # per-character rate is known — characters are still booked to the ledger.
  AUDIO_ROUTES: '{"tts":"elevenlabs/eleven_multilingual_v2"}'
  TTS_VOICES: '{"alloy":"pNInz6obpgDQGcFmaJgB"}'
  TTS_VOICE: "pNInz6obpgDQGcFmaJgB"
  TTS_COST_PER_CHAR: "0"
  LEDGER_FILE: /data/spend.jsonl
  BUDGET: "20"
  # Tenant keys are minted into the same PVC as the ledger. ANON=open during
  # rollout so existing callers keep working; flip to "closed" once every
  # client has a key.
  KEYS_FILE: /data/keys.json
  ANON: "open"
  ANON_RATE_LIMIT: "60"
  ANON_BUDGET: "2"
