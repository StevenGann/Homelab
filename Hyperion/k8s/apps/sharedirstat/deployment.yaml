apiVersion: apps/v1
kind: Deployment
metadata:
  name: sharedirstat
  namespace: sharedirstat
  labels: { app: sharedirstat, homelab.lab/auto-refresh: "true" }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: sharedirstat } }
  template:
    metadata: { labels: { app: sharedirstat } }
    spec:
      nodeSelector: { topology.kubernetes.io/zone: hyperion }
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      terminationGracePeriodSeconds: 30
      containers:
        - name: sharedirstat
          image: ghcr.io/stevengann/sharedirstat:edge
          imagePullPolicy: Always
          args: ["serve"]
          env:
            - { name: TZ, value: "America/Los_Angeles" }
          ports:
            - { name: http, containerPort: 8080 }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: "250m", memory: "256Mi" }
            limits:   { cpu: "2000m", memory: "1Gi" }
          startupProbe:
            httpGet:
              path: /readyz
              port: http
              httpHeaders: [{ name: Host, value: sharedirstat.lab }]
            failureThreshold: 60
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
              httpHeaders: [{ name: Host, value: sharedirstat.lab }]
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
              httpHeaders: [{ name: Host, value: sharedirstat.lab }]
            periodSeconds: 30
          volumeMounts:
            - { name: config, mountPath: /config, readOnly: true }
            - { name: data, mountPath: /data }
            - { name: tmp, mountPath: /tmp }
            - { name: share-movies, mountPath: /shares/movies, readOnly: false }
            - { name: share-tv-shows, mountPath: /shares/tv-shows, readOnly: false }
            - { name: share-music, mountPath: /shares/music, readOnly: false }
            - { name: share-downloads, mountPath: /shares/downloads, readOnly: false }
            - { name: share-comics, mountPath: /shares/comics, readOnly: false }
            - { name: share-youtube, mountPath: /shares/youtube, readOnly: false }
            - { name: share-roms, mountPath: /shares/roms, readOnly: false }
            - { name: share-audiobooks, mountPath: /shares/audiobooks, readOnly: false }
            - { name: share-nextcloud, mountPath: /shares/nextcloud, readOnly: false }
      volumes:
        - name: config
          configMap: { name: sharedirstat }
        - name: data
          persistentVolumeClaim: { claimName: sharedirstat-data }
        - name: tmp
          emptyDir: {}
        - name: share-movies
          nfs: { server: 192.168.10.247, path: /mnt/Media-Storage/Media/Movies, readOnly: false }
        - name: share-tv-shows
          nfs: { server: 192.168.10.247, path: /mnt/Media-Storage/Media/TV-Shows, readOnly: false }
        - name: share-music
          nfs: { server: 192.168.10.247, path: /mnt/Media-Storage/Media/Music, readOnly: false }
        - name: share-downloads
          nfs: { server: 192.168.10.247, path: /mnt/Media-Storage/Media/Downloads, readOnly: false }
        - name: share-comics
          nfs: { server: 192.168.10.247, path: /mnt/Media-Storage/Media/Comics, readOnly: false }
        - name: share-youtube
          nfs: { server: 192.168.10.247, path: /mnt/Media-Storage/Media/YouTube, readOnly: false }
        - name: share-roms
          nfs: { server: 192.168.10.247, path: /mnt/Media-Storage/Media/ROMs, readOnly: false }
        - name: share-audiobooks
          nfs: { server: 192.168.10.247, path: /mnt/Media-Storage/Media/Audiobooks, readOnly: false }
        - name: share-nextcloud
          nfs: { server: 192.168.10.247, path: /mnt/Media-Storage/NextCloud, readOnly: false }
