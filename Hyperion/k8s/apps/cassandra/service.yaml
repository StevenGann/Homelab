# LB → nginx basic-auth proxy (:8080) → dashboard (pod-loopback :9119).
apiVersion: v1
kind: Service
metadata:
  name: cassandra-dashboard
  namespace: cassandra
  annotations:
    metallb.io/loadBalancerIPs: 192.168.10.93
spec:
  type: LoadBalancer
  selector:
    app: cassandra
  ports:
    - name: http
      port: 80
      targetPort: 8080
